project_id = "sport-connect-academy-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/recovery", "http://localhost:5174/auth/recovery", "http://localhost:5173/auth/invitation", "http://localhost:5174/auth/invitation"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "2MB"

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[inbucket]
enabled = true
port = 54324

[functions.provision-invitation]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false

[functions.secure-asset-upload]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false
static_files = ["./functions/_shared/codecs/webp_dec.wasm"]

[functions.read-asset-url]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false

[functions.expand-email-outbox]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false

[functions.deliver-email]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false

[functions.brevo-webhook]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false

[functions.schedule-notifications]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false

[functions.cleanup-assets-and-content]
# Handler validates Auth / dedicated worker or webhook secret.
verify_jwt = false
